  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><b>✓</b><span>MyTickets</span></div>

        <button data-view="active" class="on"><span class="ico">⌂</span><span>Mis tickets</span><em id="nav-count">0</em></button>
        <button data-view="agenda"><span class="ico">▦</span><span>Agenda</span><em id="agenda-count">0</em></button>
        <button data-view="all"><span class="ico">▤</span><span>Todos los tickets</span></button>

        <button data-view="account"><span class="ico">☺</span><span>Cuenta</span></button>

      <div class="side-note"><b>✦ Tu espacio personal</b><p>Organiza el trabajo a tu manera, sin cambiar nada en Jira.</p></div>

  <div id="overlay"></div>
  <div id="login-screen" class="login-screen" hidden>
    <section class="login-card" aria-labelledby="login-title">
      <div class="brand-row"><b>✓</b><span>MyTickets</span></div>
      <h1 id="login-title">Inicia sesión</h1>
      <p>Tu agenda, tickets y notas quedan vinculados a tu usuario.</p>
      <div class="login-error" id="login-error"></div>
      <form id="login-form">
        <label class="field">Correo<input name="email" type="email" autocomplete="username" required placeholder="tu@correo.com"></label>
        <label class="field">Contraseña<input name="password" type="password" autocomplete="current-password" required></label>
        <button class="primary" type="submit">Entrar</button>
      </form>
    </section>
  </div>
